name: Build and deploy Market Watch

# Triggers:
#   - schedule: once a day at 06:30 UTC (after US close, before UK/EU open)
#   - workflow_dispatch: manual "Run workflow" button
#   - push to main: republish when code/design/data is edited by hand
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# GITHUB_TOKEN needs to write commits back and publish Pages. No PAT required.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest market data
        run: python fetch_data.py

      - name: Rebuild index.html
        run: python generator.py

      - name: Commit refreshed data + page (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html is generated and gitignored — the Pages artifact picks it
          # up from the working tree, so committing it only creates conflicts.
          git add market_watch_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            # [skip ci] stops this bot commit from re-triggering the push job (loop guard)
            git commit -m "chore: daily data refresh + rebuild [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root so index.html is served at the site root.
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The numbers refresh here daily; the narrative is written by the separate
  # analytical task. If that task stops running the page keeps publishing fresh
  # prices under a stale analysis. This job never blocks the deploy — it fails
  # on its own so GitHub's workflow-failure email is the alarm.
  staleness:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare analysis date with today
        run: |
          python3 - <<'EOF'
          import datetime, json, os, sys
          meta = json.load(open("market_watch_data.json"))["meta"]
          report = meta.get("report_date")
          today = datetime.date.today()
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not report:
              print("::warning::meta.report_date is missing"); sys.exit(0)
          gap = (today - datetime.date.fromisoformat(report)).days
          line = "Analysis date %s, today %s -> %d day(s) behind." % (report, today, gap)
          print(line)
          if summary:
              with open(summary, "a") as f:
                  f.write("### Analysis freshness\n\n%s\n" % line)
          if gap >= 3:
              print("::error::%s The analytical task has not run for %d days." % (line, gap))
              sys.exit(1)
          if gap >= 1:
              print("::warning::%s" % line)
          EOF
