name: Build and deploy Market Watch

# The daily update runs on the Mac mini: it fetches the numbers, does the
# analysis, renders the page and pushes. This workflow does not write to the
# repo — a second writer only causes push conflicts. It builds and serves the
# page when the mini pushes, and checks freshness on a schedule.
on:
  schedule:
    - cron: "0 8 * * *"        # staleness check only; does not build or commit
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # index.html is gitignored, so it is rendered here from the committed
      # data and template and published straight from the artifact.
      - name: Render index.html
        run: python generator.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Fails on its own when the analysis falls behind, so GitHub's
  # workflow-failure email is the alarm. Never blocks publication.
  staleness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare analysis date with today
        run: |
          python3 - <<'EOF'
          import datetime, json, os, sys
          meta = json.load(open("market_watch_data.json"))["meta"]
          report = meta.get("report_date")
          today = datetime.date.today()
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not report:
              print("::warning::meta.report_date is missing"); sys.exit(0)
          gap = (today - datetime.date.fromisoformat(report)).days
          line = "Analysis date %s, today %s -> %d day(s) behind." % (report, today, gap)
          print(line)
          if summary:
              with open(summary, "a") as f:
                  f.write("### Analysis freshness\n\n%s\n" % line)
          if gap >= 3:
              print("::error::%s The daily update on the mini has not landed for %d days." % (line, gap))
              sys.exit(1)
          if gap >= 1:
              print("::warning::%s" % line)
          EOF
