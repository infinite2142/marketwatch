name: Build and deploy Market Watch

# The daily update runs on the Mac mini: it fetches the numbers, does the
# analysis, renders the page and pushes. This workflow does not write to the
# repo — a second writer only causes push conflicts. It builds and serves the
# page when the mini pushes, and checks freshness on a schedule.
on:
  schedule:
    # Staleness check and the did-it-run alarm; does not build or commit. Not on
    # the hour: GitHub's scheduler is most congested at :00 and was running this
    # 5-9 hours late (14:00-18:00 UK, Sep-Oct 2026). 08:41 UTC is after the mini's
    # 07:00-local run has finished in both BST and GMT, so an early fire cannot
    # mistake a run still in progress for a missing one.
    - cron: "41 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes minutes apart both queue on this group. With cancel-in-progress
# false the older deploy can land last and overwrite the newer page — which is
# exactly what happened on 17 Aug. The page is regenerated from scratch every
# run, so newest-wins is always correct here.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # generator.py derives two things by walking this file's own history: the
          # change log, and every computed reading of the crash composite. The
          # default shallow clone is one commit, so the walk had nothing to diff and
          # the change log rendered empty in CI while being correct locally — a
          # silent failure, since an empty log looks like a quiet week.
          #
          # This was 60. That covered the change log's 40-revision window, but the
          # composite series wants all of it, and at 60 commits CI saw back only to
          # 26 Aug: the 60 and 67 readings fell off and the rise drew as 65 -> 79
          # instead of 60 -> 79. A truncated trend does not fail, it understates —
          # and an understated trend looks like a calm one. Full history is 10 MB.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # index.html is gitignored, so it is rendered here from the committed
      # data and template and published straight from the artifact.
      - name: Render index.html
        run: python generator.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Fails on its own when the analysis falls behind, so GitHub's
  # workflow-failure email is the alarm. Never blocks publication.
  staleness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare analysis date with today
        id: check
        run: |
          python3 - <<'EOF'
          import datetime, json, os, sys
          meta = json.load(open("market_watch_data.json"))["meta"]
          report = meta.get("report_date")
          today = datetime.date.today()
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not report:
              print("::warning::meta.report_date is missing"); sys.exit(0)
          gap = (today - datetime.date.fromisoformat(report)).days
          line = "Analysis date %s, today %s -> %d day(s) behind." % (report, today, gap)
          print(line)
          if summary:
              with open(summary, "a") as f:
                  f.write("### Analysis freshness\n\n%s\n" % line)
          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a") as f:
                  f.write("report=%s\ngap=%d\n" % (report, gap))
          if gap >= 3:
              print("::error::%s The daily update on the mini has not landed for %d days." % (line, gap))
              sys.exit(1)
          if gap >= 1:
              print("::warning::%s" % line)
          EOF

  # Independent did-it-run alarm. The mini notifies its own failures, but a
  # message from the mini cannot tell you the mini is dead. This fires from
  # GitHub's cron instead, so a day with no mini run still produces a message.
  #
  # It used to send every day, "analysis current" included - a daily message
  # saying nothing had gone wrong, and it arrived mid-afternoon because GitHub
  # ran it hours late. It is now SILENT when the analysis is dated today and
  # sends only when it is not, so a notification from it always means "look".
  # The mini's own morning notification is the news; this is only the alarm.
  # Runs on the schedule only. No-ops without the secret.
  heartbeat:
    needs: staleness
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push heartbeat to ntfy
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -u
          if [ -z "${TOPIC:-}" ]; then
            echo "NTFY_TOPIC secret not set -- heartbeat skipped"; exit 0
          fi
          python3 - > hb.txt <<'EOF'
          import datetime, json
          d = json.load(open("market_watch_data.json"))
          report = d["meta"].get("report_date") or "missing"
          try:
              gap = (datetime.date.today() - datetime.date.fromisoformat(report)).days
          except ValueError:
              gap = 99
          print(report, gap)
          EOF
          read REPORT GAP < hb.txt
          if [ "$GAP" -le 0 ]; then
            echo "analysis dated $REPORT is current -- nothing to report, no message sent"
            exit 0
          elif [ "$GAP" -eq 1 ]; then
            TITLE="Market Watch: today's run has not landed"; TAG="warning"; PRIO="high"
          else
            TITLE="Market Watch: no run for $GAP days"; TAG="rotating_light"; PRIO="urgent"
          fi
          curl -fsS --max-time 15 \
            -H "Title: $TITLE" -H "Tags: $TAG" -H "Priority: $PRIO" \
            --data-binary @- "https://ntfy.sh/$TOPIC" >/dev/null <<MSG
          Checked from GitHub, independent of the mini.
          analysis dated $REPORT
          https://infinite2142.github.io/marketwatch/
          MSG
          echo "alarm sent: $TITLE ($REPORT, ${GAP}d)"
